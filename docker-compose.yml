# Local dev: Postgres only. For production-style retention scheduling, run a cron or a small
# sidecar on the same host as the API, for example (adjust paths and DATABASE_URL):
#   0 3 * * * cd /path/to/telemetry-tracker && DATABASE_URL=... pnpm --filter api retention
# Or use a scheduler service (Railway Cron, Kubernetes CronJob, systemd timer).

services:
  postgres:
    image: postgres:16
    # Bound to localhost: the default password is "postgres". Change both before exposing it.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - telemetry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telemetry_pgdata:
